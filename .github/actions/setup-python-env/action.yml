name: Setup Python env
description: Install uv (with cache) and sync the project with the requested extra.

inputs:
  extras:
    description: Optional-dependencies group to sync (e.g. "dev", "security").
    required: false
    default: dev
  python-version:
    description: >-
      Interpreter to sync against. Empty means whatever `requires-python`
      resolves to, which is what every job wants except the compatibility
      matrix in ci.yml.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v3
      with:
        enable-cache: true
        cache-dependency-glob: uv.lock
    - name: Sync project (${{ inputs.extras }})
      shell: bash
      env:
        # uv reads this when set and ignores it when empty, so one step serves
        # both the pinned matrix legs and the jobs that do not care.
        UV_PYTHON: ${{ inputs.python-version }}
      run: uv sync --extra "${{ inputs.extras }}"
