# Continuous integration — validates the code on the `develop` branch.
#
# Runs the project's quality gate (lint + type check + tests with coverage) on every
# push to `develop` and on pull requests that target `develop`. Security scanning for
# the develop->main promotion lives in `security.yml`; native packaging/release lives
# in `build.yml`.
name: ci

on:
  push:
    branches: [develop]
  pull_request:
    # develop: validate feature merges. main: the develop->main promotion runs the
    # code gate alongside security.yml, so both are required checks before release.
    branches: [develop, main]

permissions:
  contents: read

# Use uv-managed CPython (python-build-standalone), which bundles tkinter — the
# runner's system Python lacks it and the GUI modules import tkinter at load time.
env:
  UV_PYTHON_PREFERENCE: only-managed

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-env
      - run: uv run ruff check .
      # Formatting is a gate rule, not a preference (REQ-OBS-006, Art. 8).
      - run: uv run ruff format --check .

  mypy:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-env
      - run: uv run mypy src

  boundaries:
    name: Import boundaries (import-linter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-env
      # Declared in pyproject.toml [tool.importlinter] (REQ-OBS-005, ADR-003).
      # The graph is acyclic today; this is what stops the first cycle.
      - run: uv run lint-imports

  # The suite runs on the declared floor and on the version above it
  # (REQ-DEP-007). A floor verified on a single interpreter is a floor nobody
  # has tested moving off, which is how the next bump becomes a surprise.
  # Dimensions 1 and 2 of Article 8, which the gate did not measure at all
  # before (REQ-OBS-007, code-audit P2-4).
  quality:
    name: Duplication and complexity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-env
      - name: Cognitive complexity
        run: >-
          uv run --with flake8 --with flake8-cognitive-complexity
          flake8 --select=CCR001 --max-cognitive-complexity=12 src/
      - name: Structural complexity and length
        run: uv run --with lizard lizard src/ --CCN 15 --length 200 -w
      - name: Duplication
        run: npx --yes jscpd@4 src --min-tokens 70 --threshold 3 --reporters console

  # Article 9 as a lint (REQ-OBS-008). A decision that no longer matches the
  # code is worse than an undocumented one: it is read, believed and acted on.
  intent:
    name: Intent layer (lat check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned: the version that the repo's intent layer was written against.
      - run: npx --yes lat.md@0.12.2 check

  test:
    name: Tests (pytest + coverage, py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ matrix.python-version }}
      # The suite imports the GUI modules (tkinter + pystray's X backend), which need a
      # display even though the real-window tests are skipped. Xvfb provides a headless one.
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: >-
          xvfb-run -a
          uv run pytest
          --cov=vigia_eew
          --cov-branch
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
          --cov-report=json:coverage.json
          --junitxml=report.xml
      # A single global fail_under lets a well-covered module pay for a bare
      # one. Each criticality group is asked for its own figure instead, and
      # the failure names the module that is short (REQ-OBS-003, CA-102.1).
      - run: uv run python scripts/check_coverage.py coverage.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-py${{ matrix.python-version }}
          path: |
            coverage.xml
            coverage.json
            report.xml
          retention-days: 7
